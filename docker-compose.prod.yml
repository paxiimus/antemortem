# ── Ante Mortem Production Compose ──
# Image-based deploy: backend / celery / celery-beat run the pre-built GHCR
# image tagged by commit SHA. deploy.sh exports DEPLOY_TAG and pulls it.
# No `build:` and no host-mounted code — the image is the runtime, full stop.
# Ingress is Caddy on the box: direct origin, Let's Encrypt, TLS terminated here.
# No CDN or tunnel in the path — a TLS-terminating intermediary could rewrite the
# crypto bundle served to contacts, which is the one thing E2E-in-browser can't survive.
#
# Required .env: GHCR_OWNER DB_NAME DB_USER DB_PASSWORD DJANGO_SECRET_KEY (see .env.production.example)

x-app: &app
  image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/antemortem-backend:${DEPLOY_TAG:-main}
  restart: always
  env_file: .env
  environment:
    - DB_HOST=db
    - CELERY_BROKER_URL=redis://redis:6379/0
    - ANTEMORTEM_ENV=production
    - ANTEMORTEM_AUTO_MIGRATE=0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:?DOMAIN must be set in .env}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]
    deploy: { resources: { limits: { memory: 128M } } }

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?} -d ${DB_NAME:?} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 512M } } }

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 160M } } }

  backend:
    <<: *app
    expose: ["8000"]   # Caddy only; nothing bound on the host
    deploy: { resources: { limits: { memory: 512M } } }

  celery:
    <<: *app
    command: celery -A antemortem worker -l info --concurrency=${CELERY_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD-SHELL", "celery -A antemortem inspect ping --timeout 5 -d celery@$$(hostname) > /dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy: { resources: { limits: { memory: 512M } } }

  celery-beat:
    <<: *app
    command: celery -A antemortem beat -l info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/celerybeat-schedule* -mmin -5 | grep -q . || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy: { resources: { limits: { memory: 192M } } }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
